<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titulo})}"></head>
<body>
<aside th:replace="~{fragments/layout :: sidebar('clientes')}"></aside>
<main class="conteudo">
  <div th:replace="~{fragments/layout :: topo(${titulo}, null, null, null)}"></div>
  <form class="card-x form-card" th:action="@{${acao}}" method="post">
    <div class="alert alert-danger" th:if="${erros != null and !#lists.isEmpty(erros)}">
      <ul class="mb-0"><li th:each="e : ${erros}" th:text="${e}"></li></ul></div>
    <div class="mb-3"><label class="form-label" for="nome">Nome</label>
      <input id="nome" name="nome" class="form-control" maxlength="100" required th:value="${form?.nome()}"></div>
    <div class="mb-3"><label class="form-label" for="email">E-mail</label>
      <input id="email" name="email" type="email" class="form-control" maxlength="120" required th:value="${form?.email()}"></div>
    <div class="mb-3"><label class="form-label" for="telefone">Telefone</label>
      <input id="telefone" name="telefone" class="form-control" maxlength="20" th:value="${form?.telefone()}"></div>
    <div class="d-flex gap-2 mt-4">
      <button class="btn btn-primary" type="submit">Salvar cliente</button>
      <a class="btn btn-light" th:href="@{/web/clientes}">Cancelar</a></div>
  </form>
</main>
</body>
</html>
