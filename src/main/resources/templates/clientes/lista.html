<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Clientes')}"></head>
<body>
<aside th:replace="~{fragments/layout :: sidebar('clientes')}"></aside>
<main class="conteudo">
  <div th:replace="~{fragments/layout :: topo('Clientes', 'Quem abre chamados no sistema', '/web/clientes/novo', 'Novo cliente')}"></div>
  <div th:replace="~{fragments/layout :: mensagens}"></div>

  <div class="card-x barra"><div class="busca"><i class="bi bi-search"></i>
  <input type="search" class="form-control" placeholder="Buscar..." data-filtrar="#tabela"></div></div>
  
  <div class="card-x tabela">
    <div class="vazio" th:if="${#lists.isEmpty(clientes)}"><i class="bi bi-people"></i>Nenhum cliente cadastrado. Cadastre o primeiro.</div>
    <div class="table-responsive" th:unless="${#lists.isEmpty(clientes)}">
      <table class="table">
        <thead><tr><th>Cliente</th><th>Telefone</th><th></th></tr></thead>
        <tbody>
          <tr th:each="c : ${clientes}">
            <td><div class="pessoa">
              <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(c.nome,0,1))}">A</span>
              <div><span class="fw-medium" th:text="${c.nome}"></span><small th:text="${c.email}"></small></div></div></td>
            <td th:text="${c.telefone}"></td>
            <td class="text-end">
              <div class="d-inline-flex gap-1">
                <a class="btn-icone" th:href="@{/web/clientes/{id}/editar(id=${c.id})}" title="Editar"><i class="bi bi-pencil"></i></a>
                <form th:action="@{/web/clientes/{id}/excluir(id=${c.id})}" method="post" onsubmit="return confirm('Excluir este cliente?');">
                  <button class="btn-icone perigo" type="submit" title="Excluir"><i class="bi bi-trash"></i></button></form>
              </div></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body>
</html>
