<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Técnicos')}"></head>
<body>
<aside th:replace="~{fragments/layout :: sidebar('tecnicos')}"></aside>
<main class="conteudo">
  <div th:replace="~{fragments/layout :: topo('Técnicos', 'Equipe que atende os chamados', '/web/tecnicos/novo', 'Novo técnico')}"></div>
  <div th:replace="~{fragments/layout :: mensagens}"></div>

  <div class="card-x barra"><div class="busca"><i class="bi bi-search"></i>
  <input type="search" class="form-control" placeholder="Buscar..." data-filtrar="#tabela"></div></div>
  
  <div class="card-x tabela">
    <div class="vazio" th:if="${#lists.isEmpty(tecnicos)}"><i class="bi bi-person-gear"></i>Nenhum técnico cadastrado.</div>
    <div class="table-responsive" th:unless="${#lists.isEmpty(tecnicos)}">
      <table class="table">
        <thead><tr><th>Técnico</th><th>Perfil</th><th></th></tr></thead>
        <tbody>
          <tr th:each="t : ${tecnicos}">
            <td><div class="pessoa">
              <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(t.nome,0,1))}">T</span>
              <div><span class="fw-medium" th:text="${t.nome}"></span><small th:text="${t.email}"></small></div></div></td>
            <td><span class="badge badge-status" th:text="${t.perfil}"
                      th:classappend="${t.perfil.toString() == 'ADMIN'} ? 'badge-alta' : 'badge-aberto'"></span></td>
            <td class="text-end"><div class="d-inline-flex gap-1">
              <a class="btn-icone" th:href="@{/web/tecnicos/{id}/editar(id=${t.id})}" title="Editar"><i class="bi bi-pencil"></i></a>
              <form th:action="@{/web/tecnicos/{id}/excluir(id=${t.id})}" method="post" onsubmit="return confirm('Excluir este técnico?');">
                <button class="btn-icone perigo" type="submit" title="Excluir"><i class="bi bi-trash"></i></button></form></div></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body>
</html>
