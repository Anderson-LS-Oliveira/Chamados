<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' · Chamados'">Chamados</title>
  <script>
    try {
      var t = localStorage.getItem('tema') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-bs-theme', t);
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <script th:src="@{/js/app.js}" defer></script>
</head>
<body>

<aside class="sidebar" th:fragment="sidebar(ativo)">
  <a class="brand" th:href="@{/}"><i class="bi bi-headset"></i> Chamados</a>
  <nav class="nav flex-column">
    <a class="nav-link" th:classappend="${ativo == 'dashboard'} ? 'active'" th:href="@{/}"><i class="bi bi-grid-1x2"></i> Painel</a>
    <a class="nav-link" th:classappend="${ativo == 'chamados'} ? 'active'" th:href="@{/web/chamados}"><i class="bi bi-ticket-detailed"></i> Chamados</a>
    <a class="nav-link" th:classappend="${ativo == 'clientes'} ? 'active'" th:href="@{/web/clientes}"><i class="bi bi-people"></i> Clientes</a>
    <a class="nav-link" th:classappend="${ativo == 'categorias'} ? 'active'" th:href="@{/web/categorias}"><i class="bi bi-tags"></i> Categorias</a>
    <a class="nav-link" th:classappend="${ativo == 'tecnicos'} ? 'active'" th:href="@{/web/tecnicos}"><i class="bi bi-person-gear"></i> Técnicos</a>
  </nav>
  <button type="button" class="tema-btn" data-tema><i class="bi bi-moon-stars"></i> Tema escuro</button>
  <div class="side-card">
    <i class="bi bi-life-preserver"></i>
    <strong>Central de atendimento</strong><br>Abra, atribua e acompanhe cada chamado.
  </div>
</aside>

<div class="topo" th:fragment="topo(titulo, subtitulo, acaoUrl, acaoTexto)">
  <h1><span th:text="${titulo}">Título</span>
    <small th:if="${subtitulo != null}" th:text="${subtitulo}"></small></h1>
  <a class="btn btn-primary" th:if="${acaoUrl != null}" th:href="@{${acaoUrl}}">
    <i class="bi bi-plus-lg"></i> <span th:text="${acaoTexto}">Novo</span></a>
</div>

<div class="toasts" th:fragment="mensagens">
  <div class="alert alert-success d-flex gap-2 align-items-center" th:if="${sucesso}">
    <i class="bi bi-check-circle"></i><span th:text="${sucesso}"></span></div>
  <div class="alert alert-danger d-flex gap-2 align-items-center" th:if="${erro}">
    <i class="bi bi-exclamation-circle"></i><span th:text="${erro}"></span></div>
</div>

<span th:fragment="status(v)" class="badge badge-status"
      th:classappend="${v.toString() == 'FECHADO'} ? 'badge-fechado' : (${v.toString() == 'EM_ATENDIMENTO'} ? 'badge-atend' : (${v.toString() == 'AGUARDANDO_CLIENTE'} ? 'badge-aguard' : 'badge-aberto'))">
  <i class="ponto"></i><span th:text="${#strings.capitalize(#strings.toLowerCase(#strings.replace(v.toString(), '_', ' ')))}"></span></span>

<span th:fragment="prioridade(v)" class="badge badge-status"
      th:classappend="${v.toString() == 'CRITICA'} ? 'badge-critica' : (${v.toString() == 'ALTA'} ? 'badge-alta' : (${v.toString() == 'MEDIA'} ? 'badge-media' : 'badge-baixa'))">
  <i class="ponto"></i><span th:text="${v.toString() == 'CRITICA'} ? 'Crítica' : (${v.toString() == 'MEDIA'} ? 'Média' : (${v.toString() == 'ALTA'} ? 'Alta' : 'Baixa'))"></span></span>

</body>
</html>
