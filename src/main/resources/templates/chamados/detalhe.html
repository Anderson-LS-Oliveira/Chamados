<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalhe do chamado')}"></head>
<body>
<aside th:replace="~{fragments/layout :: sidebar('chamados')}"></aside>
<main class="conteudo">
  <div th:replace="~{fragments/layout :: topo(${c.titulo}, 'Chamado #' + ${c.id}, null, null)}"></div>
  <div th:replace="~{fragments/layout :: mensagens}"></div>

  <div class="card-x stepper">
    <div class="step done"><i class="bi bi-envelope-open"></i>Aberto</div>
    <div class="step" th:classappend="${c.status.toString() != 'ABERTO'} ? 'done'"><i class="bi bi-tools"></i>Em atendimento</div>
    <div class="step" th:classappend="${c.status.toString() == 'FECHADO'} ? 'done'"><i class="bi bi-check2-circle"></i>Fechado</div>
  </div>

  <div class="detalhe-grid">
    <section>
      <div class="card-x p-4 mb-3">
        <h2><i class="bi bi-card-text"></i> Descrição</h2>
        <p class="mb-0" th:text="${c.descricao}"></p>
      </div>

      <div class="card-x p-4">
        <h2><i class="bi bi-chat-dots"></i> Comentários
          <span class="contagem" th:text="${#lists.size(comentarios)}">0</span></h2>

        <div class="vazio py-4" th:if="${#lists.isEmpty(comentarios)}">
          <i class="bi bi-chat-square-text"></i>Nenhum comentário ainda. Seja o primeiro a responder.</div>

        <div class="comentario" th:each="m : ${comentarios}">
          <span class="avatar" th:text="${m.autor != null and !#strings.isEmpty(m.autor)} ? ${#strings.toUpperCase(#strings.substring(m.autor,0,1))} : '?'">A</span>
          <div class="balao">
            <strong th:text="${m.autor}"></strong><small th:text="${#temporals.format(m.dataCriacao, 'dd/MM/yyyy HH:mm')}"></small>
            <p th:text="${m.texto}"></p>
          </div>
        </div>

        <form class="novo-coment" th:action="@{/web/chamados/{id}/comentarios(id=${c.id})}" method="post">
          <div class="row g-2">
            <div class="col-md-4"><input name="autor" class="form-control" placeholder="Seu nome" maxlength="80" required></div>
            <div class="col-12"><textarea name="texto" class="form-control" rows="3" maxlength="500" required
                data-contador="#contCom" placeholder="Escreva um comentário..."></textarea>
              <div class="dica text-end" id="contCom"></div></div>
          </div>
          <button class="btn btn-primary mt-2" type="submit"><i class="bi bi-send"></i> Comentar</button>
        </form>
      </div>
    </section>

    <aside>
      <div class="card-x p-4 mb-3">
        <h2><i class="bi bi-info-circle"></i> Informações</h2>
        <dl class="meta mb-0">
          <dt>Status</dt><dd><span th:replace="~{fragments/layout :: status(${c.status})}"></span></dd>
          <dt>Prioridade</dt><dd><span th:replace="~{fragments/layout :: prioridade(${c.prioridade})}"></span></dd>
          <dt>Aberto por</dt><dd th:text="${c.clienteNome}"></dd>
          <dt>Responsável</dt><dd th:text="${c.tecnicoNome != null} ? ${c.tecnicoNome} : 'Ainda não atribuído'"></dd>
          <dt>Categoria</dt><dd th:text="${c.categoriaNome}"></dd>
          <dt>Aberto em</dt><dd th:text="${#temporals.format(c.dataAbertura, 'dd/MM/yyyy HH:mm')}"></dd>
          <dt th:if="${c.dataFechamento != null}">Fechado em</dt>
          <dd th:if="${c.dataFechamento != null}" th:text="${#temporals.format(c.dataFechamento, 'dd/MM/yyyy HH:mm')}"></dd>
        </dl>
      </div>

      <div class="card-x p-4 mb-3" th:unless="${c.status.toString() == 'FECHADO'}">
        <h2><i class="bi bi-lightning-charge"></i> Ações</h2>
        <div class="aviso-atrib" th:if="${c.tecnicoNome == null}">
          <i class="bi bi-hourglass-split"></i> Aguardando atribuição de um técnico.</div>
        <form class="mb-3" th:action="@{/web/chamados/{id}/atribuir(id=${c.id})}" method="post">
          <label class="form-label" for="tecnicoId">Atribuir técnico</label>
          <div class="input-group">
            <select id="tecnicoId" name="tecnicoId" class="form-select" required>
              <option th:each="t : ${tecnicos}" th:value="${t.id}" th:text="${t.nome}"
                      th:selected="${c.tecnicoId != null and c.tecnicoId == t.id}"></option></select>
            <button class="btn btn-primary" type="submit">Atribuir</button>
          </div>
        </form>
        <form th:action="@{/web/chamados/{id}/status(id=${c.id})}" method="post">
          <label class="form-label" for="status">Alterar status</label>
          <div class="input-group">
            <select id="status" name="status" class="form-select" required>
              <option th:each="s : ${statusOpcoes}" th:value="${s}" th:text="${s}"
                      th:selected="${s.toString() == c.status.toString()}"></option></select>
            <button class="btn btn-primary" type="submit">Salvar</button>
          </div>
        </form>
      </div>

      <div class="d-flex justify-content-between">
        <a class="btn btn-light" th:href="@{/web/chamados}"><i class="bi bi-arrow-left"></i> Voltar</a>
        <form th:action="@{/web/chamados/{id}/excluir(id=${c.id})}" method="post"
              onsubmit="return confirm('Excluir este chamado?');">
          <button class="btn btn-outline-danger" type="submit"><i class="bi bi-trash"></i> Excluir</button>
        </form>
      </div>
    </aside>
  </div>
</main>
</body>
</html>
